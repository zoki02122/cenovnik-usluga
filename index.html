  :root{
    --bg: #131412;
    --bg-elev: #1c1d1a;
    --bg-elev-2: #24251f;
    --border: #34352e;
    --text: #eeece3;
    --text-dim: #9d9a8d;
    --text-faint: #6f6c60;
    --accent-hi: #e0b448;
    --accent: #c99a34;
    --accent-lo: #a67c22;
    --accent-text: #221a08;
    --pill-active-bg: linear-gradient(135deg, #5f451a, #40300f);
    --danger: #b8493a;
    --danger-hi: #cf5a49;
    --radius: 14px;
    /* tokeni po nameni (Klasična = dosadašnje vrednosti) */
    --act-bg: linear-gradient(135deg, var(--accent-hi), var(--accent-lo));   /* puno (glavno) dugme */
    --on-act: var(--accent-text);                                           /* tekst na njemu */
    --act-line: transparent;
    --act-shine: inset 0 1px 2px rgba(255,255,255,0.35), inset 0 -8px 14px rgba(0,0,0,0.2);
    --fab-shadow: inset 0 1px 2px rgba(255,255,255,0.35), inset 0 -8px 14px rgba(0,0,0,0.25), 0 4px 14px rgba(0,0,0,0.4);
    --tab-on-bg: var(--pill-active-bg);    /* aktivan tab kategorije */
    --tab-on-line: #5c441c;
    --tab-on-text: var(--accent-hi);
    --tab-on-shine: none;
    --price-text: var(--accent-hi);        /* cena na kartici */
    --pin-color: var(--accent-hi);         /* zvezdica zakačene veličine */
    --hi-text: var(--accent-hi);           /* naglašen tekst na običnoj pozadini */
    --focus-line: var(--accent-lo);        /* obris fokusa */
    --backdrop: rgba(10,10,8,0.72);
    --danger-bg: rgba(184,73,58,0.12);
    --danger-line: rgba(184,73,58,0.35);
    --danger-text: var(--danger-hi);
    --danger-grad: linear-gradient(135deg, var(--danger-hi), var(--danger));
    --on-danger: #2a1310;
    --banner-bg: linear-gradient(135deg, #3a2f14, #2c2410);
    --banner-line: #4a3c18;
    --banner-text: var(--accent-hi);
    --banner-btn-bg: var(--accent);
    --banner-btn-text: var(--accent-text);
    --font-ui: 'Barlow',sans-serif;
    --font-title: 'Barlow Condensed',sans-serif;
    --font-num: 'Barlow Condensed',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);height:100%;overscroll-behavior-y: none;}
  body{display:flex; flex-direction:column; min-height:100vh;}
  h1,h2,h3,.num{font-family:var(--font-title);}
  button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; color:inherit; cursor:pointer;}
  input,textarea{font-family:inherit;}

  /* ---------- Sticky top (header + tabs) ---------- */
  .sticky-top{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  header{
    padding:14px 16px 12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .h-title{display:flex; flex-direction:column; line-height:1.05;}
  .h-title .t1{font-size:22px; font-weight:700; letter-spacing:0.2px; font-family:var(--font-title);}
  .h-title .t2{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .h-actions{display:flex; gap:8px; flex-shrink:0;}
  .gear-btn{
    width:40px; height:40px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-elev-2); border:1px solid var(--border);
    flex-shrink:0;
  }
  .gear-btn svg{width:20px;height:20px;stroke:var(--text-dim);}

  .tabs-row{
    display:flex; gap:8px; padding:0 16px 14px;
  }
  .tab-pill{
    flex:1 1 0;
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 6px;
    border-radius:22px;
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-size:13.5px; font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
  }
  .tab-pill span{overflow:hidden; text-overflow:ellipsis;}
  .tab-pill svg{width:16px;height:16px; stroke:var(--text-dim); flex-shrink:0;}
  .tab-pill.active{
    background:var(--tab-on-bg);
    border-color:var(--tab-on-line);
    color:var(--tab-on-text);
    box-shadow:var(--tab-on-shine);
  }
  .tab-pill.active svg{stroke:var(--tab-on-text);}

  .backup-banner{
    background:var(--banner-bg);
    border-top:1px solid var(--banner-line);
    color:var(--banner-text);
    font-size:13px;
    padding:9px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .backup-banner button{
    flex-shrink:0;
    background:var(--banner-btn-bg); color:var(--banner-btn-text);
    font-weight:700; font-size:12.5px;
    padding:6px 12px; border-radius:8px;
  }

  main{flex:1; padding:16px 16px 100px; max-width:520px; margin:0 auto; width:100%;}

  .cat-sub-heading{font-size:13px; color:var(--text-faint); margin-bottom:14px;}

  /* ---------- Price cards ---------- */
  .price-card{
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 14px 11px;
    margin-bottom:8px;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:manipulation;
  }
  .price-card:active{transform:scale(0.99);}
  .pin-badge{width:14px;height:14px; color:var(--pin-color); flex-shrink:0;}
  .pc-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .pc-left{display:flex; align-items:center; gap:7px; flex-wrap:nowrap; min-width:0; overflow:hidden;}
  .pc-size{font-size:21px; font-weight:700; font-family:var(--font-num); flex-shrink:0;}
  .pc-price{font-size:30px; font-weight:800; color:var(--price-text); font-family:var(--font-num); flex-shrink:0; white-space:nowrap;}
  .pc-price.empty{font-size:14px; font-weight:600; color:var(--text-faint); font-family:var(--font-ui);}
  .pc-price .din{font-size:15px; font-weight:600; color:var(--text-dim); margin-left:3px;}
  .pc-tag{
    font-size:11px; font-weight:600;
    padding:4px 10px 4px 8px; border-radius:14px;
    background:var(--bg-elev-2); border:1px solid var(--border);
    color:var(--text-dim);
    white-space:nowrap;
    display:inline-flex; align-items:center; gap:5px;
    flex-shrink:0;
  }
  .pc-tag svg{width:17px;height:17px; flex-shrink:0; stroke:currentColor;}
  .pc-note{margin-top:6px; font-size:12.5px; color:var(--text-faint); font-style:italic; line-height:1.3;}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--text-faint); font-size:14px;
  }

  /* ---------- Floating add button ---------- */
  .fab{
    position:fixed; bottom:26px; right:20px; z-index:15;
    width:56px; height:56px; border-radius:50%;
    background:var(--act-bg);
    box-shadow:var(--fab-shadow);
    display:flex; align-items:center; justify-content:center;
  }
  .fab svg{width:26px;height:26px; stroke:var(--on-act); stroke-width:2.4;}

  /* ---------- Modal sheet (shared) ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:var(--backdrop);
    z-index:100; display:none; align-items:center; justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal-sheet{
    width:calc(100% - 32px); max-width:520px; max-height:85vh; overflow-y:auto;
    background:var(--bg-elev); border-radius:20px;
    border:1px solid var(--border);
    padding:18px 16px calc(24px + env(safe-area-inset-bottom));
    animation: sheetUp 0.22s ease-out;
    position:fixed; top:42%; left:50%; transform:translate(-50%,-50%); margin:0;
  }
  @keyframes sheetUp{from{opacity:0.4; transform:translate(-50%,-50%) scale(0.95);} to{opacity:1; transform:translate(-50%,-50%) scale(1);}}
  .modal-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 14px;}
  .modal-title{font-size:19px; font-weight:700; margin-bottom:4px; padding-right:36px;}
  .modal-sub{font-size:13px; color:var(--text-faint); margin-bottom:18px;}
  .modal-close{
    position:absolute; top:16px; right:16px;
    width:32px; height:32px; border-radius:9px;
    background:var(--bg-elev-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .modal-close svg{width:16px;height:16px; stroke:var(--text-dim);}

  .field-block{margin-bottom:14px;}
  .field-label{font-size:12.5px; color:var(--text-faint); margin-bottom:6px; display:block;}
  .field-input{
    width:100%; background:var(--bg-elev-2); border:1px solid var(--border);
    border-radius:10px; padding:12px 12px; color:var(--text); font-size:16px;
  }
  .field-input:focus{outline:none; border-color:var(--focus-line);}
  textarea.field-input{resize:vertical; min-height:60px; font-size:14.5px;}

  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .btn-cancel{
    flex:1; background:var(--bg-elev-2); border:1px solid var(--border);
    color:var(--text-dim); font-weight:700; font-size:15px;
    padding:13px; border-radius:12px; text-align:center;
  }
  .btn-save{
    flex:1;
    background:var(--act-bg);
    box-shadow:var(--act-shine);
    color:var(--on-act); font-weight:700; font-size:15px;
    padding:13px; border-radius:12px; text-align:center;
  }
  .btn-delete{
    width:100%; margin-top:10px;
    background:var(--danger-bg); border:1px solid var(--danger-line);
    color:var(--danger-text); font-weight:700; font-size:14.5px;
    padding:13px; border-radius:12px; text-align:center;
  }

  /* ---------- Settings content (price rows, backup) ---------- */
  .settings-section{margin-bottom:22px;}
  .settings-section-title{
    font-size:13px; font-weight:700; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:0.4px; margin-bottom:10px;
    padding-bottom:6px; border-bottom:1px solid var(--border);
  }
  .cat-edit-block{margin-bottom:18px;}
  .cat-edit-name{font-size:15px; font-weight:600; margin-bottom:8px;}
  .price-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--border);
  }
  .price-row:last-child{border-bottom:none;}
  .price-row .pr-size{width:52px; flex-shrink:0; font-size:14px; font-weight:600; color:var(--text-dim);}
  .price-row .pr-inputs{flex:1; min-width:0; display:flex; gap:6px; flex-wrap:wrap;}
  .pr-field{flex:1; min-width:70px; position:relative;}
  .pr-field label{position:absolute; top:-7px; left:9px; font-size:9px; background:var(--bg-elev); padding:0 4px; color:var(--text-faint);}
  .pr-field input{
    width:100%; min-width:0; background:var(--bg-elev-2); border:1px solid var(--border);
    border-radius:8px; padding:9px 8px; color:var(--text); font-size:13.5px;
    font-weight:600;
  }
  .pr-field input:focus{outline:none; border-color:var(--focus-line);}
  .pr-field.market input, .pr-field.complete input{color:var(--text-dim); font-weight:500;}
  .remove-size-btn{
    width:28px; height:28px; border-radius:7px; flex-shrink:0;
    background:var(--bg-elev-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .remove-size-btn svg{width:13px;height:13px; stroke:var(--danger-text);}

  .backup-row{display:flex; gap:10px;}
  .backup-btn{
    flex:1; background:var(--bg-elev-2); border:1px solid var(--border);
    color:var(--text); font-size:13.5px; font-weight:600;
    padding:12px 8px; border-radius:10px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .backup-btn svg{width:18px;height:18px; stroke:var(--hi-text);}
  .reminder-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-size:14px; color:var(--text-dim);
  }
  .reminder-row input{
    width:64px; flex-shrink:0; text-align:center; background:var(--bg-elev-2);
    border:1px solid var(--border); border-radius:8px; padding:9px 7px; color:var(--text); font-size:16px;
  }
  .reminder-row input:focus{outline:none; border-color:var(--focus-line);}
  .last-backup-note{font-size:11.5px; color:var(--text-faint); margin-top:10px;}
  .set-hint{font-size:12.5px; color:var(--text-faint); line-height:1.4; margin:10px 2px 0;}
  .save-settings-btn{
    width:100%; margin-top:6px;
    background:var(--act-bg);
    box-shadow:var(--act-shine);
    color:var(--on-act); font-weight:700; font-size:15.5px;
    padding:14px; border-radius:12px; text-align:center;
  }

  /* ---------- Confirm dialog ---------- */
  .confirm-overlay{
    position:fixed; inset:0; background:var(--backdrop);
    z-index:200; display:none; align-items:center; justify-content:center; padding:30px;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-box{
    background:var(--bg-elev); border:1px solid var(--border);
    border-radius:16px; padding:22px 18px 18px; width:100%; max-width:340px;
    text-align:center;
  }
  .confirm-box .ct{font-size:17px; font-weight:700; margin-bottom:8px;}
  .confirm-box .cm{font-size:14px; color:var(--text-dim); margin-bottom:20px; line-height:1.4;}
  .confirm-actions{display:flex; gap:10px;}
  .confirm-actions button{flex:1; padding:12px; border-radius:10px; font-weight:700; font-size:14.5px;}
  .confirm-cancel{background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text-dim);}
  .confirm-ok{background:var(--danger-grad); color:var(--on-danger);}
  .confirm-ok.pos{background:var(--act-bg); color:var(--on-act);}

  /* pitanje za izlaz (pravi se u JS-u) */
  .exit-box{position:fixed; top:42%; left:50%; transform:translate(-50%,-50%); margin:0;}
  .exit-icon{font-size:128px; line-height:1; margin-bottom:10px;}
  .exit-emo{font-size:44px; vertical-align:-14px; margin-right:6px;}
  .ic-svg{display:none;}

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--bg-elev-2); border:1px solid var(--border);
    color:var(--text); font-size:13.5px; font-weight:600;
    padding:11px 20px; border-radius:24px; z-index:300;
    opacity:0; pointer-events:none; transition:opacity 0.25s;
  }
  .toast.show{opacity:1;}

  input[type=file]{display:none;}

  /* ---------- QR prikaz (beli okvir ostaje beo u svim temama, zbog skenera) ---------- */
  .qr-overlay{padding:24px;}
  .qr-wrap{width:100%; max-width:360px;}
  .qr-top{display:flex; justify-content:flex-end; margin-bottom:10px;}
  .modal-close.qr-close{position:static;}
  .qr-frame{background:#fff; border-radius:16px; padding:20px; display:flex; flex-direction:column; align-items:center; gap:12px;}
  .qr-frame img{max-width:100%; max-height:56vh; display:block; border-radius:6px;}
  .qr-caption{color:#1a1a1a; font-weight:700; font-size:14px; font-family:'Barlow',sans-serif;}
  .qr-actions{display:flex; gap:10px; margin-top:14px;}
  .qr-actions .btn-cancel{flex:1;}
  .qr-actions .btn-delete{flex:1; margin-top:0;}

  /* ---------- Meni dugog pritiska ---------- */
  .menu-btn{width:100%;}
  .btn-cancel.menu-btn.menu-first{margin-bottom:10px;}
  .btn-delete.menu-btn{margin-top:0;}
  .btn-cancel.menu-btn.menu-last{margin-top:10px;}

  /* ================= PODEŠAVANJA: ceo ekran sa pločicama ================= */
  .settings-screen{position:fixed; inset:0; z-index:50; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(24px + env(safe-area-inset-bottom));}
  .set-header{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:4px; padding:calc(10px + env(safe-area-inset-top)) 12px 10px 6px; background:var(--bg); border-bottom:1px solid var(--border);}
  .set-back{width:44px; height:44px; color:var(--text-dim); border-radius:12px; display:flex; align-items:center; justify-content:center; padding:0; flex:none;}
  .set-back:active{background:var(--bg-elev);}
  .set-title{flex:1; min-width:0; margin:0; font-family:var(--font-title); font-size:22px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .set-body{padding:16px 14px; max-width:560px; margin:0 auto;}
  .set-tile{display:flex; align-items:center; gap:14px; width:100%; padding:18px 16px; margin:0 0 12px; background:var(--bg-elev); border:1px solid var(--border); border-radius:16px; text-align:left; color:var(--text);}
  .set-tile:active{background:var(--bg-elev-2);}
  .set-tile .tile-icon{font-size:26px; width:36px; text-align:center; line-height:1; flex:none;}
  .set-tile .tile-text{flex:1; min-width:0;}
  .set-tile .tile-title{display:block; font-size:16px; font-weight:700;}
  .set-tile .tile-sub{display:block; font-size:12px; color:var(--text-dim); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .set-tile .tile-chev{color:var(--text-dim); font-size:22px; flex:none; line-height:1;}
  .set-card{background:var(--bg-elev); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:14px;}
  .set-card .cat-edit-name{margin-bottom:4px;}
  /* lista tema */
  .theme-opt{display:flex; align-items:center; gap:14px; width:100%; padding:12px; margin:0 0 10px; background:var(--bg-elev); border:1.5px solid var(--border); border-radius:16px; text-align:left; color:var(--text);}
  .theme-opt.on{border-color:var(--focus-line); box-shadow:0 0 0 3px color-mix(in srgb, var(--focus-line) 22%, transparent);}
  .theme-opt .sw{width:74px; height:48px; border-radius:10px; flex:none; position:relative; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(128,128,128,.25);}
  .theme-opt .sw i{position:absolute; left:7px; right:7px; bottom:7px; height:15px; border-radius:5px;}
  .theme-opt .sw b{position:absolute; right:9px; top:7px; font:700 11px Georgia,serif;}
  .theme-opt .t-name{flex:1; font-size:15.5px; font-weight:700;}
  .theme-opt .t-check{width:24px; height:24px; border-radius:50%; border:1.5px solid var(--border); flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--on-act);}
  .theme-opt.on .t-check{background:var(--act-bg); border-color:var(--focus-line); box-shadow:var(--act-shine);}

/* ================= ZAJEDNIČKO ZA NOVE TEME ================= */
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .ic-emoji{display:none;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .ic-svg{display:block;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .exit-box{width:calc(100% - 32px);}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .exit-icon{color:var(--hi-text); margin-bottom:14px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .exit-icon .ic-svg{margin:0 auto;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .exit-box .confirm-actions button{display:flex; align-items:center; justify-content:center; gap:8px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .exit-box .confirm-actions .ic-svg{flex:none;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) :is(.gear-btn,.modal-close,.remove-size-btn){width:40px; height:40px; border-radius:50%;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) :is(.gear-btn,.modal-close,.remove-size-btn) svg{stroke:currentColor;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .modal-close{top:12px; right:12px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .remove-size-btn{width:34px; height:34px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .modal-title{font-family:var(--font-title); padding-right:44px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .tab-pill{border-radius:999px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .tab-pill svg{stroke:currentColor;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .pc-tag{background:transparent;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) :is(.btn-cancel,.btn-save,.btn-delete,.save-settings-btn,.confirm-actions button){border-radius:999px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) :is(.btn-cancel,.btn-save,.btn-delete,.save-settings-btn){padding:13px 10px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) input.field-input{border-radius:999px; padding:12px 16px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) textarea.field-input{border-radius:16px; padding:12px 16px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) :is(.pr-field input,.reminder-row input){border-radius:999px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .pr-field input{padding:9px 10px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .pr-field label{left:12px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .backup-btn{border-radius:16px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .backup-banner{margin:0 16px 12px; border-radius:16px; padding:7px 7px 7px 14px; border:1px solid var(--danger-line); font-size:12.5px; line-height:1.3;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .backup-banner button{border-radius:999px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .settings-section-title{text-transform:none; letter-spacing:0; font-size:13.5px;}
:is([data-theme="banka"],[data-theme="ponoc"],[data-theme="ponoc-srebro"],[data-theme="koza"]) .qr-caption{font-family:var(--font-ui);}

/* ================= TEMA: PONOĆ i PONOĆ SREBRNA (isti oblici; razlikuju se samo tokenima naglaska) ================= */
html:is([data-theme="ponoc"],[data-theme="ponoc-srebro"]){
  color-scheme:dark;
  --bg:#000000; --surface:#1E2024; --surface-2:#1D1F24; --line:#34363C; --text:#E9E8E4; --muted:#9A9A9F;
  --red:#C25B4A; --danger-line:#C25B4A;
  --accent:#4A9D68; --num-hi:#6FC48A; --accent-deep:#2F6B45; --on-accent:#0C1F13;
  --g-grad:linear-gradient(135deg,#6FC48A,#2F6B45);
  --g-shine:inset 0 1px 0 rgba(255,255,255,.35);
  --card-shine:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 55%);
  --act-bg:var(--g-grad); --on-act:var(--on-accent); --act-line:transparent; --act-shine:var(--g-shine);
  --hi-text:var(--num-hi); --focus-line:var(--accent-deep); --backdrop:rgba(0,0,0,.6);
  /* nazivi Cenovnika */
  --bg-elev:#1E2024; --bg-elev-2:#1D1F24; --border:#34363C; --text-dim:#9A9A9F; --text-faint:#9A9A9F;
  --danger:#C25B4A; --danger-hi:#C25B4A;
  --fab-shadow:0 4px 12px rgba(0,0,0,.35), var(--g-shine);
  --tab-on-bg:var(--g-grad); --tab-on-line:transparent; --tab-on-text:var(--on-accent); --tab-on-shine:var(--g-shine);
  --price-text:var(--num-hi); --pin-color:var(--accent);
  --danger-bg:#000000; --danger-text:#C25B4A; --danger-grad:#000000; --on-danger:#C25B4A;
  --banner-bg:var(--card-shine), #1E2024; --banner-line:#C25B4A; --banner-text:#E9E8E4; --banner-btn-bg:#000000; --banner-btn-text:#C25B4A;
  --font-ui:'Barlow',-apple-system,Roboto,sans-serif;
  --font-title:'Barlow Condensed','Barlow',sans-serif;
  --font-num:'Barlow Condensed','Barlow',sans-serif;
}
html[data-theme="ponoc-srebro"]{
  --accent:#B8BEC6; --num-hi:#E3E6EA; --accent-deep:#6C727A; --on-accent:#F2F4F6;
  --g-grad:linear-gradient(135deg,#9AA1A9 0%,#555B63 40%,#2B2F34 75%,#474C53 100%);
  --g-shine:inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.07);
  --alu-text:linear-gradient(180deg,#D3D8DE 0%,#A9B0B8 45%,#7E858E 80%,#949BA3 100%);
}
/* zaglavlje, tabovi, okrugla dugmad i polja su crni; boju imaju samo pločice */

    var OLD_SWAPPED_PUTNICKA = {

  // ---------- Back-button handling for overlays (same pattern proven in Kućna apoteka) ----------
  // Every overlay we open pushes one history entry. A real back-button press pops it and
  // just hides the top overlay instead of leaving the app. Closing via an in-app button (X,
  // Cancel, Save...) goes through closeTopOverlay(), which calls history.back() itself and
  // suppresses the resulting popstate so it isn't handled twice.
  var overlayStack = [];
  var suppressPopstate = 0;
  var programmaticClose = false;   // true dok aplikacija sama zatvara nivo (ne sistemsko "nazad")

  function pushOverlayState(hideFn){
    overlayStack.push(hideFn);
    history.pushState({ cenovnikOverlay: overlayStack.length }, "");
  }

  function closeTopOverlay(){
    if(overlayStack.length === 0) return;
    var hideFn = overlayStack.pop();
    suppressPopstate++;
    history.back();
    programmaticClose = true;
    try{ hideFn(); } finally { programmaticClose = false; }
  }

  // zatvara n gornjih nivoa odjednom, uz JEDAN povratak istorije za sve njih (history.go(-n))
  function closeLevels(n){
    n = Math.min(n, overlayStack.length);
    if(n <= 0) return;
    var fns = [];
    for(var i = 0; i < n; i++) fns.push(overlayStack.pop());
    suppressPopstate++;
    history.go(-n);
    programmaticClose = true;
    try{ fns.forEach(function(fn){ fn(); }); } finally { programmaticClose = false; }
  }

  }, {once:true});

  window.addEventListener("popstate", function(){

    }
    if(overlayStack.length > 0){

  });

  function fmt(n){
    if(n === null || n === undefined || isNaN(n)) return "—";
    var rounded = Math.round(Number(n));
    var neg = rounded < 0;
    var intPart = String(Math.abs(rounded));
    var withDots = "";
    while(intPart.length > 3){
      withDots = "." + intPart.slice(-3) + withDots;
      intPart = intPart.slice(0, -3);
    }
    withDots = intPart + withDots;
    return (neg ? "-" : "") + withDots;
  }

  function sizeSortKey(sz){
    var m = String(sz).match(/\d+/);
    return m ? parseInt(m[0], 10) : 0;
  }

  function getSortedSizes(cat){
    var pinned = [];
    var rest = [];
    cat.sizes.forEach(function(sz){
      var p = cat.prices[sz] || {};
      if(p.pinned) pinned.push(sz); else rest.push(sz);
    });
    pinned.sort(function(a,b){ return sizeSortKey(a) - sizeSortKey(b); });
    rest.sort(function(a,b){ return sizeSortKey(a) - sizeSortKey(b); });
    return pinned.concat(rest);
  }

  // ---------- Reliable field navigation (proven fix from Stanje guma — Android Chrome/Gboard) ----------
  var fieldOriginal = new WeakMap();
  var pristineArmed = new WeakSet();

  function snapshotField(el){
    fieldOriginal.set(el, el.value);
  }

  function handleFocusSelect(el){
    if(el.type === "date"){ pristineArmed.delete(el); return; }
    el.select();
    pristineArmed.add(el);
  }

  function getFocusableChain(container){
    return Array.prototype.slice.call(container.querySelectorAll("input, textarea")).filter(function(el){
      var block = el.closest(".field-block") || el.closest(".pr-field") || el;
      return block.offsetParent !== null;
    });
  }

  function wireBackspace(el){
    if(el.__backspaceWired) return;
    el.__backspaceWired = true;
    var goPrev = function(){ if(el.__prevField) el.__prevField.focus(); };
    el.addEventListener("focus", function(){ handleFocusSelect(el); });
    el.addEventListener("keydown", function(e){
      if(e.key !== "Backspace") return;
      if(el.value === "" || pristineArmed.has(el)){
        e.preventDefault();
        goPrev();
      }
    });
    el.addEventListener("beforeinput", function(e){
      if(e.inputType !== "deleteContentBackward") return;
      if(el.value === "" || pristineArmed.has(el)){
        e.preventDefault();
        goPrev();
      }
    });
    el.addEventListener("input", function(e){
      if(!pristineArmed.has(el)) return;
      // samo pravo brisanje (Backspace koji Gboard ipak prođe) vraća dobru vrednost;
      // kucanje nove cene koja počinje istom cifrom se više ne tumači kao brisanje
      if(e.inputType === "deleteContentBackward"){
        var original = fieldOriginal.get(el);
        if(typeof original !== "string") original = "";
        el.value = original;
        goPrev();
        return;
      }
      pristineArmed.delete(el);
    });
  }

  function wireFieldChain(container){
    var fields = getFocusableChain(container);
    fields.forEach(function(el, i){
      el.__prevField = i > 0 ? fields[i-1] : null;
      wireBackspace(el);
      snapshotField(el);
    });
  }

  // ---------- Forward navigation ("dalje" key) for bulk edit only ----------
  // Enter/Next moves to the next field in DOM order (Ukupno -> Tr. -> Pč. -> next row -> next category).
  // On the very last field, Enter triggers onLast (Sačuvaj izmene).
  function wireForwardChain(container, onLast){
    var fields = getFocusableChain(container);
    fields.forEach(function(el, i){
      var isLast = i === fields.length - 1;
      el.__nextField = isLast ? null : fields[i+1];
      el.setAttribute("enterkeyhint", isLast ? "done" : "next");
      if(el.__forwardWired) return;
      el.__forwardWired = true;
      el.addEventListener("keydown", function(e){
        if(e.key !== "Enter" && e.keyCode !== 13) return;
        e.preventDefault();
        var next = el.__nextField;
        if(next){
          next.focus();
          next.scrollIntoView({block:"center"});
        } else if(typeof el.__onLast === "function"){
          el.blur();
          el.__onLast();
        }
      });
    });
    if(fields.length) fields[fields.length-1].__onLast = onLast;
  }

  // ---------- Price field formatting: show "3.700" when not editing, plain digits while editing ----------
  function parseNum(str){

  function armPriceField(el){
    if(el.__priceFmtWired) return;
    el.__priceFmtWired = true;
    el.addEventListener("input", function(){
      var digits = el.value.replace(/[^\d]/g, "");
      if(digits !== el.value) el.value = digits;
    });
    el.addEventListener("focus", function(){
      var digits = el.value.replace(/[^\d]/g, "");
      if(digits !== el.value) el.value = digits;
    });
    el.addEventListener("blur", function(){
      var digits = el.value.replace(/[^\d]/g, "");
      el.value = digits ? fmt(Number(digits)) : "";
    });
  }

  // ---------- Tap vs long-press on a card ----------
  function wireCardInteraction(card, onTap, onLongPress){
    var timer = null;
    var longPressFired = false;
    var moved = false;
    var startX = 0, startY = 0;

    card.addEventListener("pointerdown", function(e){
      longPressFired = false;
      moved = false;
      startX = e.clientX; startY = e.clientY;
      timer = setTimeout(function(){
        longPressFired = true;
        if(navigator.vibrate) navigator.vibrate(15);
        onLongPress();
      }, 500);
    });
    card.addEventListener("pointermove", function(e){
      if(Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10){
        moved = true;
        clearTimeout(timer);
      }
    });
    card.addEventListener("pointerup", function(){
      clearTimeout(timer);
      if(!longPressFired && !moved){ onTap(); }
    });
    card.addEventListener("pointercancel", function(){ clearTimeout(timer); });
    card.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  }

      if(!ok) return;
      var cat = DATA.categories[editingCat];
      cat.sizes = cat.sizes.filter(function(s){ return s !== editingSize; });

  // ---------- Add size sheet ----------
  var addSizeOverlay = document.getElementById("addSizeOverlay");
  var addSizeTitle = document.getElementById("addSizeTitle");
  var newSizeLabel = document.getElementById("newSizeLabel");
  var newSizePrice = document.getElementById("newSizePrice");
  var newSizeNote = document.getElementById("newSizeNote");
  armPriceField(newSizePrice);

  // Auto-append the inch mark (") as the user types digits, so they only need to type the number.
  // Stays permissive: if the size needs a range ("10-13") or "and up" (">"), those characters
  // still pass through untouched — we only add the closing " when what's typed is plain digits/hyphens
  // and nothing has already supplied a closing mark.
  newSizeLabel.addEventListener("input", function(){
    var v = newSizeLabel.value;
    var core = v.replace(/["″]+$/, "").replace(/>+$/, "");
    if(core === ""){
      if(v !== "") newSizeLabel.value = "";
      return;
    }
    if(/^[0-9-]+$/.test(core) && !/["″>]$/.test(v)){
      var newVal = core + "\"";
      if(newVal !== v){
        newSizeLabel.value = newVal;
        newSizeLabel.setSelectionRange(core.length, core.length);
      }
    }
  });

  fabAdd.addEventListener("click", function(){
    var cat = DATA.categories[state.activeCat];
    addSizeTitle.textContent = "Nova veličina — " + cat.label;
    newSizeLabel.value = "";
    newSizePrice.value = "";
    newSizeNote.value = "";
    addSizeOverlay.classList.add("open");
    wireFieldChain(addSizeOverlay);
    pushOverlayState(function(){ addSizeOverlay.classList.remove("open"); });

    var entry = { own: priceVal };
    var noteVal = newSizeNote.value.trim();
    if(noteVal) entry.note = noteVal;

  // ---------- TEME (ključ cenovnik_usluga_theme; ide i u bekap) ----------
  var LS_THEME = "cenovnik_usluga_theme";
  var THEMES = [
    {id:"banka",        name:"Privatno bankarstvo", bar:"#0E2747", bg:"#F6F5F1", card:"linear-gradient(140deg,#16365F,#0A1C34)", num:"#D9B46A"},
    {id:"ponoc",        name:"Ponoć",               bar:"#000000", bg:"#000000", card:"#1E2024", num:"#6FC48A"},
    {id:"ponoc-srebro", name:"Ponoć srebrna",       bar:"#000000", bg:"#000000", card:"#1E2024", num:"#D5D9DE"},
    {id:"koza",         name:"Kožni rokovnik",      bar:"#1F3A2E", bg:"#EFE8D8", card:"#1F3A2E", num:"#7A2331"},
    {id:"klasicna",     name:"Klasična",            bar:"#131412", bg:"#131412", card:"linear-gradient(135deg,#e0b448,#a67c22)", num:"#e0b448"}
  ];
  function validTheme(id){ return THEMES.some(function(x){ return x.id === id; }); }
  function findTheme(id){
    for(var i = 0; i < THEMES.length; i++){ if(THEMES[i].id === id) return THEMES[i]; }
    return THEMES[THEMES.length - 1];
  }
  function getTheme(){
    var t = null;
    try{ t = localStorage.getItem(LS_THEME); }catch(e){}
    return validTheme(t) ? t : "klasicna";
  }
  function applyTheme(id){
    var th = findTheme(id);
    document.documentElement.setAttribute("data-theme", th.id);
    var meta = document.getElementById("metaThemeColor");
    if(meta) meta.setAttribute("content", th.bar);
  }
  function setTheme(id){
    if(!validTheme(id)) return;
    try{ localStorage.setItem(LS_THEME, id); }catch(e){}
    applyTheme(id);
  }
  function themeOptionsHtml(){
    var cur = getTheme();
    return THEMES.map(function(x){
      return '<button type="button" class="theme-opt'+(x.id === cur ? ' on' : '')+'" data-theme-id="'+x.id+'">'+
        '<span class="sw" style="background:'+x.bg+'"><i style="background:'+x.card+'"></i><b style="color:'+x.num+'">3.400</b></span>'+
        '<span class="t-name">'+escapeHtml(x.name)+'</span><span class="t-check">'+(x.id === cur ? '✓' : '')+'</span></button>';
    }).join("");
  }

  // ---------- PODEŠAVANJA: ceo ekran sa pločicama (svaki nivo = tačno jedan korak istorije) ----------
  var settingsScreenEl = null;   // nivo 1: ekran sa pločicama
  var settingsSubKey = null;     // nivo 2: otvoren pod-ekran
  var SETTINGS_BACK_SVG = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
  var NUM_ATTR = 'inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';

  function daniRec(n){ return (n % 10 === 1 && n % 100 !== 11) ? "dan" : "dana"; }
  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function fmtDateShort(ts){
    var d = new Date(ts);
    return pad2(d.getDate()) + "." + pad2(d.getMonth() + 1) + "." + d.getFullYear() + ".";
  }

  function tileHtml(key, icon, title, sub){
    return '<button type="button" class="set-tile" data-tile="'+key+'">'+
      '<span class="tile-icon">'+icon+'</span>'+
      '<span class="tile-text"><span class="tile-title">'+escapeHtml(title)+'</span><span class="tile-sub">'+escapeHtml(sub)+'</span></span>'+
      '<span class="tile-chev">›</span></button>';

  function setSettingsView(title, bodyHtml){
    if(!settingsScreenEl) return null;
    settingsScreenEl.querySelector("#setTitle").textContent = title;
    var body = settingsScreenEl.querySelector("#setBody");
    body.innerHTML = bodyHtml;
    settingsScreenEl.scrollTop = 0;

  function renderSettingsTiles(){
    var n = DATA.reminderDays || 7;
    var catNames = CAT_ORDER.map(function(k){ return DATA.categories[k].label; }).join(", ");
    var body = setSettingsView("Podešavanja",
      tileHtml("theme", "🎨", "Tema", findTheme(getTheme()).name) +
      tileHtml("prices", "💰", "Cene", catNames) +
      tileHtml("backup", "💾", "Rezervna kopija", DATA.lastBackup ? "Poslednja: " + fmtDateShort(DATA.lastBackup) : "Još nije napravljena") +
      tileHtml("reminder", "⏰", "Podsetnik za bekap", n === 1 ? "Svaki dan" : "Na svakih " + n + " " + daniRec(n)));
    if(!body) return;
    body.querySelectorAll("[data-tile]").forEach(function(btn){
      btn.addEventListener("click", function(){ openSettingsSub(btn.getAttribute("data-tile")); });

  function openSettingsScreen(){
    if(settingsScreenEl) return;

      '<h2 class="set-title" id="setTitle"></h2></div><div class="set-body" id="setBody"></div>';
    document.body.appendChild(el);
    document.body.style.overflow = "hidden";
    settingsScreenEl = el;
    el.querySelector("#setBackBtn").addEventListener("click", settingsBack);
    pushOverlayState(hideSettingsScreen);
    renderSettingsTiles();

  function hideSettingsScreen(){
    if(settingsScreenEl){ settingsScreenEl.remove(); settingsScreenEl = null; }
    settingsSubKey = null;
    document.body.style.overflow = "";
  }

  function openSettingsSub(key){
    if(!settingsScreenEl || settingsSubKey) return;
    var body;
    if(key === "theme"){
      body = setSettingsView("Tema", '<div id="themeOptList">'+themeOptionsHtml()+'</div>');
      var list = body.querySelector("#themeOptList");
      list.addEventListener("click", function(e){
        var opt = e.target.closest("[data-theme-id]");
        if(!opt) return;
        setTheme(opt.getAttribute("data-theme-id"));
        list.innerHTML = themeOptionsHtml();
      });
    } else if(key === "prices"){
      body = setSettingsView("Cene",
        '<div class="settings-section">'+
          '<div class="settings-section-title">Cene po kategoriji</div>'+
          '<div id="priceEditArea"></div>'+
        '</div>'+
        '<button class="save-settings-btn" id="saveSettingsBtn">Sačuvaj izmene</button>');
      renderPriceEditArea();
      body.querySelector("#saveSettingsBtn").addEventListener("click", saveSettingsPrices);
    } else if(key === "backup"){
      body = setSettingsView("Rezervna kopija",
        '<div class="settings-section">'+
          '<div class="settings-section-title">Bekap podataka</div>'+
          '<div class="set-card">'+
            '<div class="backup-row">'+
              '<button class="backup-btn" id="exportBtn">'+
                '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>'+
                'Izvezi (JSON)'+
              '</button>'+
              '<button class="backup-btn" id="importBtn">'+
                '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>'+
                'Uvezi (JSON)'+
              '</button>'+
            '</div>'+
            '<div class="last-backup-note" id="lastBackupNote"></div>'+
          '</div>'+
        '</div>');
      body.querySelector("#exportBtn").addEventListener("click", doExportBackup);
      body.querySelector("#importBtn").addEventListener("click", function(){ importFile.click(); });
      refreshLastBackupNote();
    } else if(key === "reminder"){
      body = setSettingsView("Podsetnik za bekap",
        '<div class="set-card"><div class="reminder-row">'+
          '<label for="reminderDaysInput">Podseti me na svakih (dana)</label>'+
          '<input type="text" id="reminderDaysInput" maxlength="3" '+NUM_ATTR+' value="'+(DATA.reminderDays || 7)+'">'+
        '</div></div>'+
        '<div class="set-hint">Kad prođe ovoliko dana od poslednjeg bekapa, na vrhu se pojavi podsetnik.</div>');
      var rdInput = body.querySelector("#reminderDaysInput");
      wireFieldChain(body);
      rdInput.addEventListener("input", function(){
        var digits = rdInput.value.replace(/[^\d]/g, "");
        if(digits !== rdInput.value) rdInput.value = digits;
        var rd = Number(digits);
        if(digits !== "" && rd > 0){
          DATA.reminderDays = rd;
          saveData();
          checkBackupBanner();
        }
      });
    } else {
      return;
    }
    settingsSubKey = key;
    pushOverlayState(hideSettingsSub);
  }

  function hideSettingsSub(){
    if(settingsSubKey === "prices" && !programmaticClose && pricesDirty()){
      // sistemsko "nazad" sa nesačuvanim cenama: istorija je već vraćena za korak,
      // pa vraćamo taj nivo i pitamo pre odbacivanja
      pushOverlayState(hideSettingsSub);
      askDiscardPrices();
      return;
    }
    settingsSubKey = null;
    if(settingsScreenEl) renderSettingsTiles();

  function settingsBack(){

    closeTopOverlay();

  function askDiscardPrices(){

    askConfirm("Odbaciti izmene?", "Izmene cena nisu sačuvane.", "Odbaci", false, "Ostani", true).then(function(ok){

  // ---------- Pod-ekran Cene (masovna izmena) ----------
  function fieldId(catKey, sz, type){
    return "f_"+catKey+"_"+encodeURIComponent(sz)+"_"+type;
  }

  function renderPriceEditArea(){
    var priceEditArea = document.getElementById("priceEditArea");
    if(!priceEditArea) return;
    // već otkucane (nesačuvane) vrednosti ostaju posle ponovnog iscrtavanja (npr. posle uklanjanja veličine)
    var typed = {};
    priceEditArea.querySelectorAll(".pr-field input").forEach(function(inp){ typed[inp.id] = inp.value; });
    priceEditArea.innerHTML = "";
    CAT_ORDER.forEach(function(catKey){
      var cat = DATA.categories[catKey];
      var block = document.createElement("div");
      block.className = "cat-edit-block set-card";
      var rowsHtml = "";
      cat.sizes.forEach(function(sz){
        var p = cat.prices[sz] || {};
        rowsHtml += '<div class="price-row">' +
          '<div class="pr-size">'+sz+'</div>' +
          '<div class="pr-inputs">' +
            '<div class="pr-field"><label>Ukupno</label><input type="text" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" id="'+fieldId(catKey,sz,'own')+'" value="'+(typeof p.own==="number"?fmt(p.own):"")+'" placeholder="—"></div>' +
            (cat.hasMarket ? '<div class="pr-field market"><label>Tr.</label><input type="text" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" id="'+fieldId(catKey,sz,'market')+'" value="'+(typeof p.market==="number"?fmt(p.market):"")+'" placeholder="—"></div>' : '') +
            (cat.hasComplete ? '<div class="pr-field complete"><label>Pč.</label><input type="text" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" id="'+fieldId(catKey,sz,'complete')+'" value="'+(typeof p.complete==="number"?fmt(p.complete):"")+'" placeholder="—"></div>' : '') +
          '</div>' +
          (cat.allowAddSize ? '<button class="remove-size-btn" data-remove="'+catKey+'|'+String(sz).replace(/&/g,"&amp;").replace(/"/g,"&quot;")+'"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>' : '') +
        '</div>';
      });
      block.innerHTML = '<div class="cat-edit-name">'+cat.label+'</div>' + rowsHtml;
      priceEditArea.appendChild(block);
    });

    priceEditArea.querySelectorAll(".pr-field input").forEach(function(inp){
      if(Object.prototype.hasOwnProperty.call(typed, inp.id)) inp.value = typed[inp.id];
      armPriceField(inp);
    });
    wireFieldChain(priceEditArea);
    wireForwardChain(priceEditArea, saveSettingsPrices);

    priceEditArea.querySelectorAll("[data-remove]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var parts = btn.getAttribute("data-remove").split("|");
        var catKey = parts[0], sz = parts[1];
        askConfirm("Ukloniti veličinu "+sz+"?", "Cena za ovu veličinu će biti obrisana iz cenovnika.", "Ukloni", false).then(function(ok){
          if(!ok) return;
          var cat = DATA.categories[catKey];
          cat.sizes = cat.sizes.filter(function(s){ return s !== sz; });
          delete cat.prices[sz];
          saveData();
          renderPriceEditArea();
          renderCardList();
          showToast("Veličina uklonjena");
        });
      });
    });
  }

  function priceFieldTypes(cat){
    var t = ["own"];
    if(cat.hasMarket) t.push("market");
    if(cat.hasComplete) t.push("complete");
    return t;
  }

  // da li se polja razlikuju od sačuvanih cena
  function pricesDirty(){
    if(!document.getElementById("priceEditArea")) return false;
    return CAT_ORDER.some(function(catKey){
      var cat = DATA.categories[catKey];
      return cat.sizes.some(function(sz){
        var p = cat.prices[sz] || {};
        return priceFieldTypes(cat).some(function(type){
          var el = document.getElementById(fieldId(catKey, sz, type));
          if(!el) return false;
          var saved = typeof p[type] === "number" ? p[type] : undefined;
          return parseNum(el.value) !== saved;
        });
      });
    });
  }

  function collectPriceEdits(){
    CAT_ORDER.forEach(function(catKey){
      var cat = DATA.categories[catKey];
      cat.sizes.forEach(function(sz){
        if(!cat.prices[sz]) cat.prices[sz] = {};
        var ownEl = document.getElementById(fieldId(catKey,sz,'own'));
        var ownVal = parseNum(ownEl && ownEl.value);
        if(ownVal !== undefined && !isNaN(ownVal)) cat.prices[sz].own = ownVal;
        else delete cat.prices[sz].own;

        if(cat.hasMarket){
          var mEl = document.getElementById(fieldId(catKey,sz,'market'));
          var mVal = parseNum(mEl && mEl.value);
          if(mVal !== undefined && !isNaN(mVal)) cat.prices[sz].market = mVal;
          else delete cat.prices[sz].market;
        }
        if(cat.hasComplete){
          var cEl = document.getElementById(fieldId(catKey,sz,'complete'));
          var cVal = parseNum(cEl && cEl.value);
          if(cVal !== undefined && !isNaN(cVal)) cat.prices[sz].complete = cVal;
          else delete cat.prices[sz].complete;
        }
      });
    });
  }

  function saveSettingsPrices(){
    collectPriceEdits();
    saveData();
    renderCardList();
    checkBackupBanner();
    closeLevels(2);   // pod-ekran Cene + ekran podešavanja, jednim korakom istorije
    showToast("Sačuvano");
  }

  function refreshLastBackupNote(){
    var lastBackupNote = document.getElementById("lastBackupNote");
    if(!lastBackupNote) return;
    if(!DATA.lastBackup){
      lastBackupNote.textContent = "Još uvek nisi napravio bekap.";
      return;
    }
    var d = new Date(DATA.lastBackup);
    lastBackupNote.textContent = "Poslednji bekap: " + d.toLocaleDateString("sr-RS") + " u " + d.toLocaleTimeString("sr-RS", {hour:'2-digit', minute:'2-digit'});
  }

  document.getElementById("openSettings").addEventListener("click", openSettingsScreen);

  // ---------- Export / Import ----------
  function doExportBackup(){
    var payload = JSON.stringify(Object.assign({}, DATA, { theme: getTheme() }), null, 2);
    var blob = new Blob([payload], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = "cenovnik-usluga-bekap-"+stamp+".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    DATA.lastBackup = Date.now();
    saveData();
    refreshLastBackupNote();
    checkBackupBanner();
    showToast("Bekap izvezen");
  }

  var importFile = document.getElementById("importFile");
  importFile.addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      askConfirm("Uvesti bekap?", "Ovo će zameniti sve trenutne cene podacima iz fajla.", "Uvezi", true).then(function(ok){
        if(!ok){ importFile.value = ""; return; }
        try{
          var parsed = JSON.parse(evt.target.result);
          if(!parsed || !parsed.categories) throw new Error("bad format");
          // tema ne ide u cenovnik_usluga_v1, čuva se pod svojim ključem
          var importedTheme = parsed.theme;
          delete parsed.theme;
          // stari bekap bez intervala ne menja trenutni interval
          if(!(typeof parsed.reminderDays === "number" && parsed.reminderDays > 0)) parsed.reminderDays = DATA.reminderDays;
          DATA = loadDataFromObject(parsed);
          saveData();
          if(validTheme(importedTheme)) setTheme(importedTheme);
          renderTabs();
          renderCardList();
          refreshLastBackupNote();
          checkBackupBanner();
          showToast("Bekap uvezen");
        }catch(err){
          showToast("Fajl nije validan bekap");
        }
        importFile.value = "";
      });
    };
    reader.readAsText(file);
  });

  function loadDataFromObject(obj){
    // reuse same normalization as loadData(), but from an in-memory object instead of localStorage
    var tmpKey = STORAGE_KEY + "_tmp_import";
    localStorage.setItem(tmpKey, JSON.stringify(obj));
    var backupRaw = localStorage.getItem(STORAGE_KEY);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
    var normalized = loadData();
    localStorage.removeItem(tmpKey);
    if(backupRaw !== null) localStorage.setItem(STORAGE_KEY, backupRaw);
    return normalized;
  }

  // ---------- Backup reminder banner ----------
  var backupBanner = document.getElementById("backupBanner");
  var backupBannerText = document.getElementById("backupBannerText");
  document.getElementById("backupBannerBtn").addEventListener("click", doExportBackup);
  function checkBackupBanner(){
    var days = DATA.reminderDays || 7;
    if(!DATA.lastBackup){
      backupBannerText.textContent = "Još nemaš bekap podataka — napravi ga sada.";
      backupBanner.style.display = "flex";
      return;
    }
    var diffDays = (Date.now() - DATA.lastBackup) / (1000*60*60*24);
    if(diffDays >= days){
      backupBannerText.textContent = "Prošlo je "+Math.floor(diffDays)+" dana od poslednjeg bekapa.";
      backupBanner.style.display = "flex";
    } else {
      backupBanner.style.display = "none";
    }
  }

  // ---------- QR code for payment ----------
  var openQrBtn = document.getElementById("openQr");
  var qrViewOverlay = document.getElementById("qrViewOverlay");
  var qrViewImg = document.getElementById("qrViewImg");
  var qrFileInput = document.getElementById("qrFileInput");
  var qrChangeBtn = document.getElementById("qrChangeBtn");
  var qrRemoveBtn = document.getElementById("qrRemoveBtn");

  function showQrViewer(){
    qrViewImg.src = DATA.qrCodeImage;
    if(!qrViewOverlay.classList.contains("open")){
      qrViewOverlay.classList.add("open");
      pushOverlayState(function(){ qrViewOverlay.classList.remove("open"); });
    }
  }
  function closeQrViewer(){ qrViewOverlay.classList.remove("open"); }

  openQrBtn.addEventListener("click", function(){
    if(DATA.qrCodeImage){ showQrViewer(); }
    else { qrFileInput.click(); }
  });
  document.getElementById("closeQrView").addEventListener("click", closeTopOverlay);
  qrChangeBtn.addEventListener("click", function(){ qrFileInput.click(); });
  qrRemoveBtn.addEventListener("click", function(){
    askConfirm("Ukloniti QR kod?", "Moraćeš ponovo da dodaš sliku kad ti zatreba.", "Ukloni", false).then(function(ok){
      if(!ok) return;
      delete DATA.qrCodeImage;
      saveData();
      closeTopOverlay();
      showToast("QR kod uklonjen");
    });
  });
  qrFileInput.addEventListener("change", function(e){
    var file = e.target.files[0];
    qrFileInput.value = "";
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      var previous = DATA.qrCodeImage;
      DATA.qrCodeImage = evt.target.result;
      if(saveData()){
        showQrViewer();
        showToast("QR kod sačuvan");
      } else {
        DATA.qrCodeImage = previous;
        showToast("Slika je prevelika za čuvanje — probaj manju sliku");
      }
    };
    reader.readAsDataURL(file);
  });

  // ---------- Init ----------
  renderTabs();
  renderCardList();
  checkBackupBanner();

  // ---------- PWA: register service worker ----------
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

})();
</script>
</body>
</html>
